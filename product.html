<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIGHTNING | 商品詳情</title>
    <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root { --bg-white: #ffffff; --baby-yellow: #FEF9C3; --text-main: #333333; --border-color: #f0f0f0; --radius-lg: 16px; --transition: all 0.3s ease; }
        body { background-color: var(--bg-white); color: var(--text-main); line-height: 1.6; }
        
        nav { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            min-height: 75px; 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(8px);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 5%; 
            z-index: 1000; 
            border-bottom: 1px solid var(--border-color); 
            gap: 15px; 
            flex-wrap: wrap;
        }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; text-decoration: none; color: #333; flex-shrink: 0; }
        
        .nav-search-container { flex-grow: 1; max-width: 400px; min-width: 200px; }
        .nav-search-input { width: 100%; padding: 10px 18px; border: 1px solid var(--border-color); border-radius: 20px; font-size: 13px; outline: none; background: #fafafa; transition: var(--transition); }
        .nav-search-input:focus { border-color: #111; background: #fff; }

        .nav-right-group { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        
        .back-home-btn { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            font-size: 13px; 
            font-weight: 500; 
            cursor: pointer; 
            color: var(--text-main); 
            padding: 8px 14px; 
            border-radius: 20px; 
            background: #fafafa; 
            border: 1px solid var(--border-color); 
            text-decoration: none; 
            transition: var(--transition); 
            white-space: nowrap;
        }
        .back-home-btn:hover { background: var(--baby-yellow); border-color: #e5e5e5; }

        .product-detail-container { max-width: 1100px; margin: 100px auto 60px; padding: 0 5%; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        
        /* 🌟 商品圖片輪播與佔位樣式 */
        .product-image-slider, .product-gallery-placeholder { 
            position: relative; 
            width: 100%; 
            height: 500px; 
            background-color: #f9f9f8; 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            touch-action: pan-y;
        }
        .product-image-slider img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .product-image-slider img.active { display: block; }
        .product-gallery-placeholder { font-size: 15px; color: #888; }

        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; opacity: 0; transition: 0.3s; z-index: 5; }
        .product-image-slider:hover .slider-btn { opacity: 1; }
        .slider-btn.prev { left: 15px; }
        .slider-btn.next { right: 15px; }
        .slider-btn:hover { background: rgba(0,0,0,0.7); }

        .slider-dots { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
        .slider-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s; }
        .slider-dot.active { background: #ffffff; width: 20px; border-radius: 4px; }

        /* 右側資訊區塊 */
        .product-info-wrapper { 
            padding: 10px 0; 
            display: flex;
            flex-direction: column;
        }
        .breadcrumbs { font-size: 13px; color: #888; margin-bottom: 12px; }
        .detail-name { font-size: 28px; font-weight: 600; margin-bottom: 12px; line-height: 1.3; }
        .detail-price { font-size: 22px; font-weight: 600; color: #111; margin-bottom: 15px; }
        
        .detail-description { 
            font-size: 14px; 
            color: #555; 
            margin-bottom: 20px; 
            white-space: pre-wrap; 
            line-height: 1.8;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 8px;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        
        .detail-description::-webkit-scrollbar { width: 6px; }
        .detail-description::-webkit-scrollbar-thumb { background-color: #ddd; border-radius: 3px; }

        .quantity-action-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 12px;
        }
        .quantity-selector {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: #fafafa;
        }
        .qty-btn {
            background: none;
            border: none;
            padding: 12px 16px;
            font-size: 16px;
            cursor: pointer;
            color: #333;
            transition: var(--transition);
        }
        .qty-btn:hover {
            background: #eee;
        }
        .qty-input {
            width: 50px;
            text-align: center;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }

        .add-to-cart-huge { 
            flex-grow: 1;
            background: #111; 
            color: #fff; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: var(--transition); 
        }
        .add-to-cart-huge:hover { background: #333; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        #loadingMsg { text-align: center; padding: 150px; font-size: 18px; color: #888; grid-column: 1/-1;}

        @media (max-width: 768px) {
            nav { padding: 10px 4%; }
            .nav-search-container { order: 3; width: 100%; max-width: 100%; margin-top: 5px; }
            .product-detail-container { grid-template-columns: 1fr; gap: 30px; margin-top: 140px; padding: 0 4%; }
            .product-info-wrapper { height: auto; }
            .product-image-slider, .product-gallery-placeholder { height: 350px; }
            .detail-name { font-size: 24px; }
            .detail-price { font-size: 20px; }
            .detail-description { max-height: none; }
            .quantity-action-container {
                flex-direction: column;
                align-items: stretch;
            }
            .quantity-selector {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">LIGHTNING</a>
        
        <div class="nav-search-container">
            <input type="text" id="navSearchInput" class="nav-search-input" placeholder="🔍 搜尋商品名稱或分類..." onkeypress="handleNavSearch(event)">
        </div>

        <div class="nav-right-group">
            <a href="index.html" class="back-home-btn">
                <span>←</span> 返回首頁
            </a>
        </div>
    </nav>

    <main class="product-detail-container" id="mainContainer">
        <div id="loadingMsg">正在從雲端載入商品資料...</div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBky8OW6DkZ1nmcH_uqARRCBKuYmkavMzI",
            authDomain: "tester-ec75c.firebaseapp.com",
            projectId: "tester-ec75c",
            storageBucket: "tester-ec75c.firebasestorage.app",
            messagingSenderId: "761357583297",
            appId: "1:761357583297:web:5d7bc8f4afc16a38cce540",
            measurementId: "G-PGXJMR5LMT"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentProduct = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!productId) {
                document.getElementById('mainContainer').innerHTML = `<h2 style="grid-column:1/-1; text-align:center;">找不到商品，請返回首頁。</h2>`;
                return;
            }

            db.collection("products").doc(productId).get().then((doc) => {
                if (doc.exists) {
                    currentProduct = { id: doc.id, ...doc.data() };
                    renderProductDetail();
                } else {
                    document.getElementById('mainContainer').innerHTML = `<h2 style="grid-column:1/-1; text-align:center;">商品不存在或已下架。</h2>`;
                }
            }).catch((error) => {
                console.log("讀取錯誤:", error);
            });
        });

        function handleNavSearch(e) {
            if (e.key === 'Enter') {
                const keyword = e.target.value.trim();
                if (keyword) {
                    window.location.href = `index.html?search=${encodeURIComponent(keyword)}`;
                }
            }
        }

        function renderProductDetail() {
            const container = document.getElementById('mainContainer');
            const descText = currentProduct.description || "這件商品尚未提供詳細描述，但它絕對值得擁有！";
           
            // 🌟 過濾有效圖片
            const validImages = currentProduct.images ? currentProduct.images.filter(img => img && img.trim() !== '') : [];
            const hasImages = validImages.length > 0;
            let galleryHtml = '';

            if (hasImages) {
                // 🌟 第一張優先載入 src，其餘使用 data-src 延遲載入
                const imgs = validImages.map((img, idx) => `
                    <img ${idx === 0 ? `src="${img}"` : `data-src="${img}"`} 
                         class="${idx === 0 ? 'active' : ''}" 
                         data-index="${idx}"
                         loading="${idx === 0 ? 'eager' : 'lazy'}"
                         decoding="async">
                `).join('');

                const dots = validImages.length > 1 ? `<div class="slider-dots">${validImages.map((_, idx) => `<span class="slider-dot ${idx === 0 ? 'active' : ''}" onclick="changeSlide('${currentProduct.id}', ${idx})"></span>`).join('')}</div>` : '';
                const controls = validImages.length > 1 ? `
                    <button class="slider-btn prev" onclick="moveSlide('${currentProduct.id}', -1)">&#10094;</button>
                    <button class="slider-btn next" onclick="moveSlide('${currentProduct.id}', 1)">&#10095;</button>
                ` : '';
                
                // 🌟 綁定手機觸控滑動切換圖片事件
                galleryHtml = `<div class="product-image-slider" id="slider-${currentProduct.id}" ontouchstart="handleTouchStart('${currentProduct.id}', event)" ontouchend="handleTouchEnd('${currentProduct.id}', event)">${imgs}${controls}${dots}</div>`;
            } else {
                galleryHtml = `<div class="product-gallery-placeholder"><span>${currentProduct.category || 'NO IMAGE'} 示意圖</span></div>`;
            }

            container.innerHTML = `
                ${galleryHtml}
                <div class="product-info-wrapper">
                    <div class="breadcrumbs">首頁 / ${currentProduct.category} / ${currentProduct.name}</div>
                    <h1 class="detail-name">${currentProduct.name}</h1>
                    <div class="detail-price">HKD ${Number(currentProduct.price).toFixed(1)}</div>
                    
                    <div class="detail-description">${descText}</div>
                    
                    <div class="quantity-action-container">
                        <div class="quantity-selector">
                            <button type="button" class="qty-btn" onclick="updateQty(-1)">-</button>
                            <input type="number" id="productQuantity" class="qty-input" value="1" min="1" readonly>
                            <button type="button" class="qty-btn" onclick="updateQty(1)">+</button>
                        </div>
                        <button class="add-to-cart-huge" onclick="addToCart()">加入購物車</button>
                    </div>
                </div>
            `;
        }
        
        window.sliderIndexes = {};

        function changeSlide(productId, index) {
            const slider = document.getElementById(`slider-${productId}`);
            if (!slider) return;
            const imgs = slider.querySelectorAll('img');
            const dots = slider.querySelectorAll('.slider-dot');
            
            if (imgs.length === 0) return;
            let targetIndex = (index + imgs.length) % imgs.length;
            window.sliderIndexes[productId] = targetIndex;

            // 🌟 懶載入機制：切換到該張圖片時若尚未載入 src，則在此時賦值讀取
            const targetImg = imgs[targetIndex];
            if (targetImg.dataset.src) {
                targetImg.src = targetImg.dataset.src;
                targetImg.removeAttribute('data-src');
            }

            imgs.forEach((img, idx) => {
                img.classList.toggle('active', idx === targetIndex);
            });
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === targetIndex);
            });
        }

        function moveSlide(productId, direction) {
            const slider = document.getElementById(`slider-${productId}`);
            if (!slider) return;
            const imgs = slider.querySelectorAll('img');
            let currentIndex = window.sliderIndexes[productId] || 0;
            changeSlide(productId, currentIndex + direction);
        }

        // 🌟 手機左右滑動切換圖片 (Touch Swipe)
        let touchStartX = 0;
        let touchStartY = 0;

        function handleTouchStart(productId, e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchEnd(productId, e) {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                if (diffX < 0) {
                    moveSlide(productId, 1);  // 向左滑 -> 下一張
                } else {
                    moveSlide(productId, -1); // 向右滑 -> 上一張
                }
            }
        }

        function updateQty(change) {
            const qtyInput = document.getElementById('productQuantity');
            let currentQty = parseInt(qtyInput.value) || 1;
            currentQty += change;
            if (currentQty < 1) currentQty = 1;
            qtyInput.value = currentQty;
        }

        function addToCart() {
            const qtyInput = document.getElementById('productQuantity');
            const quantityToAdd = parseInt(qtyInput.value) || 1;

            let cart = JSON.parse(localStorage.getItem('lightning_life_cart')) || [];
            const item = cart.find(x => x.id === currentProduct.id);
            if (item) {
                item.quantity += quantityToAdd;
            } else {
                cart.push({ id: currentProduct.id, name: currentProduct.name, price: Number(currentProduct.price), quantity: quantityToAdd });
            }
            localStorage.setItem('lightning_life_cart', JSON.stringify(cart));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
