<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIGHTNING | 商品詳情</title>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root { --bg-white: #ffffff; --baby-yellow: #FEF9C3; --text-main: #333333; --border-color: #f0f0f0; --radius-lg: 16px; }
        body { background-color: var(--bg-white); color: var(--text-main); line-height: 1.6; }
        
        /* 導覽列 */
        nav { position: fixed; top: 0; left: 0; width: 100%; height: 75px; background: rgba(255, 255, 255, 0.95); display: flex; justify-content: space-between; align-items: center; padding: 0 6%; z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; text-decoration: none; color: #333; }
        .cart-icon-wrapper { cursor: pointer; position: relative; }
        .cart-count { position: absolute; top: -4px; right: -6px; background-color: var(--baby-yellow); font-size: 11px; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold;}
        
        /* 商品詳情雙欄排版 */
        .product-detail-container { max-width: 1100px; margin: 120px auto 60px; padding: 0 4%; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
        
        .product-gallery { background-color: #f9f9f8; border-radius: var(--radius-lg); height: 600px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #aaa; }
        
        .product-info-wrapper { padding: 20px 0; }
        .breadcrumbs { font-size: 13px; color: #888; margin-bottom: 15px; }
        .detail-name { font-size: 32px; font-weight: 600; margin-bottom: 15px; line-height: 1.3;}
        .detail-price { font-size: 24px; font-weight: 600; color: #111; margin-bottom: 30px; }
        
        .detail-description { font-size: 15px; color: #555; margin-bottom: 40px; white-space: pre-wrap; line-height: 1.8;}
        
        .add-to-cart-huge { width: 100%; background: #111; color: #fff; padding: 18px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .add-to-cart-huge:hover { background: #333; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1);}

        /* 載入中畫面 */
        #loadingMsg { text-align: center; padding: 150px; font-size: 18px; color: #888; grid-column: 1/-1;}

        @media (max-width: 768px) {
            .product-detail-container { grid-template-columns: 1fr; gap: 30px; margin-top: 100px; }
            .product-gallery { height: 400px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">LIGHTNING</a>
        <div class="cart-icon-wrapper" onclick="alert('請返回首頁查看購物車！')">
            🛒 <div class="cart-count" id="cartCount">0</div>
        </div>
    </nav>

    <main class="product-detail-container" id="mainContainer">
        <div id="loadingMsg">正在從雲端載入商品資料...</div>
        </main>

    <script>
        // ⚠️ 貼上你的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBky8OW6DkZ1nmcH_uqARRCBKuYmkavMzI",
            authDomain: "tester-ec75c.firebaseapp.com",
            projectId: "tester-ec75c",
            storageBucket: "tester-ec75c.firebasestorage.app",
            messagingSenderId: "761357583297",
            appId: "1:761357583297:web:5d7bc8f4afc16a38cce540",
            measurementId: "G-PGXJMR5LMT"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🌟 核心：解析網址參數，找出商品 ID
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentProduct = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!productId) {
                document.getElementById('mainContainer').innerHTML = `<h2 style="grid-column:1/-1; text-align:center;">找不到商品，請返回首頁。</h2>`;
                return;
            }

            // 根據 ID 向 Firebase 索取特定單一商品
            db.collection("products").doc(productId).get().then((doc) => {
                if (doc.exists) {
                    currentProduct = { id: doc.id, ...doc.data() };
                    renderProductDetail();
                } else {
                    document.getElementById('mainContainer').innerHTML = `<h2 style="grid-column:1/-1; text-align:center;">商品不存在或已下架。</h2>`;
                }
            }).catch((error) => {
                console.log("讀取錯誤:", error);
            });

            // 初始化上方購物車數字
            let cart = JSON.parse(localStorage.getItem('lightning_life_cart')) || [];
            document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.quantity, 0);
        });

        function renderProductDetail() {
            const container = document.getElementById('mainContainer');
            // 如果沒有填寫描述，給予預設文字
            const descText = currentProduct.description || "這件商品尚未提供詳細描述，但它絕對值得擁有！";

            container.innerHTML = `
                <div class="product-gallery">
                    <span>${currentProduct.category} 示意圖</span>
                </div>
                <div class="product-info-wrapper">
                    <div class="breadcrumbs">首頁 / ${currentProduct.category} / ${currentProduct.name}</div>
                    <h1 class="detail-name">${currentProduct.name}</h1>
                    <div class="detail-price">NT$ ${currentProduct.price.toLocaleString()}</div>
                    
                    <div class="detail-description">${descText}</div>
                    
                    <button class="add-to-cart-huge" onclick="addToCart()">加入購物車</button>
                </div>
            `;
        }

        function addToCart() {
            let cart = JSON.parse(localStorage.getItem('lightning_life_cart')) || [];
            const item = cart.find(x => x.id === currentProduct.id);
            if (item) {
                item.quantity++;
            } else {
                cart.push({ id: currentProduct.id, name: currentProduct.name, price: currentProduct.price, quantity: 1 });
            }
            localStorage.setItem('lightning_life_cart', JSON.stringify(cart));
            
            // 更新網頁右上角數字
            document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.quantity, 0);
            alert(`已將「${currentProduct.name}」加入購物車！請回首頁結帳。`);
        }
    </script>
</body>
</html>
