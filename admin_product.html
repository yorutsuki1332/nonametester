<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIGHTNING ADMIN | 現時上架貨品</title>
    <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Noto Sans TC', 'Helvetica Neue', sans-serif;
        }

        :root {
            --bg-main: #f9f9f8;
            --bg-white: #ffffff;
            --baby-yellow: #FEF9C3;
            --text-main: #333333;
            --text-muted: #888888;
            --border-color: #e5e5e5;
            --radius-lg: 16px;
            --radius-md: 8px;
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* 側邊導覽列 */
        aside {
            width: 260px;
            background-color: var(--bg-white);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 50px;
            color: var(--text-main);
            padding-left: 10px;
        }

        .logo span {
            color: var(--text-muted);
            font-size: 12px;
            display: block;
            margin-top: 5px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-menu li a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .nav-menu li a:hover, .nav-menu li a.active {
            background-color: var(--baby-yellow);
            color: var(--text-main);
            font-weight: 600;
        }

        /* 主內容區塊 */
        main {
            margin-left: 260px;
            flex-grow: 1;
            padding: 40px 5%;
            max-width: 1200px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* 商品列表卡片 */
        .products-card {
            background-color: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }

        .product-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .product-table th {
            padding: 15px;
            border-bottom: 2px solid var(--border-color);
            color: var(--text-muted);
            font-weight: 600;
        }

        .product-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .product-table tr:hover {
            background-color: #fafafa;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: #eee;
        }

        .badge.new { background: #111; color: #fff; }
        .badge.hot { background: #ff6b6b; color: #fff; }

        .btn-danger {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
        }

        .btn-danger:hover {
            background-color: #fa5252;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(200%);
            background-color: var(--text-main);
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            z-index: 3000;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; position: relative; padding: 20px; flex-direction: row; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
            .logo { margin-bottom: 0; }
            .nav-menu { display: none; }
            main { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>
    <aside>
        <div class="logo">LIGHTNING<span>SELLER CENTER</span></div>
        <ul class="nav-menu">
            <li><a href="admin.html">📍 上架新商品</a></li>
            <li><a href="admin_products.html" class="active">🛒 現時上架貨品</a></li>
        </ul>
    </aside>
    <main>
        <div class="page-header">
            <h1>現時上架貨品</h1>
            <p>管理目前所有在雲端資料庫中的商品清單。</p>
        </div>
        <div class="products-card">
            <table class="product-table">
                <thead>
                    <tr>
                        <th>商品名稱</th>
                        <th>分類</th>
                        <th>標籤</th>
                        <th>售價 (HKD)</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="adminProductTableBody">
                    <tr><td colspan="5" style="text-align: center; color: #888; padding: 30px;">正在載入商品資料...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="toast" id="toastMessage">✅ 已成功刪除商品！</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBky8OW6DkZ1nmcH_uqARRCBKuYmkavMzI",
            authDomain: "tester-ec75c.firebaseapp.com",
            projectId: "tester-ec75c",
            storageBucket: "tester-ec75c.firebasestorage.app",
            messagingSenderId: "761357583297",
            appId: "1:761357583297:web:5d7bc8f4afc16a38cce540",
            measurementId: "G-PGXJMR5LMT"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener('DOMContentLoaded', () => {
            fetchAdminProducts();
        });

        function fetchAdminProducts() {
            db.collection("products").orderBy("createdAt", "desc").onSnapshot((querySnapshot) => {
                const tbody = document.getElementById('adminProductTableBody');
                let products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });

                if (products.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #888; padding: 30px;">目前尚無任何上架商品</td></tr>`;
                    return;
                }

                tbody.innerHTML = products.map(p => `
                    <tr>
                        <td style="font-weight: 500;">${p.name}</td>
                        <td>${p.category}</td>
                        <td>${p.tag ? `<span class="badge ${p.tag.toLowerCase()}">${p.tag}</span>` : '<span style="color:#aaa;">無</span>'}</td>
                        <td>HKD ${Number(p.price).toFixed(1)}</td>
                        <td>
                            <button class="btn-danger" onclick="deleteProduct('${p.id}')">刪除</button>
                        </td>
                    </tr>
                `).join('');
            });
        }

        function deleteProduct(productId) {
            if (confirm('確定要下架並刪除此商品嗎？')) {
                db.collection("products").doc(productId).delete().then(() => {
                    const toast = document.getElementById('toastMessage');
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 3000);
                }).catch((error) => {
                    alert('刪除失敗： ' + error.message);
                });
            }
        }
    </script>
</body>
</html>
